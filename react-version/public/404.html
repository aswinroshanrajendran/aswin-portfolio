<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aswin Roshan - Growth Strategist</title>
    <!-- GitHub Pages SPA fallback: encode the requested path and hand off to index.html -->
    <script type="text/javascript">
      var segmentCount = 0; // bump if deployed under a subpath (project site)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
