name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage deployed files
        # upload-pages-artifact only accepts a single directory, so the
        # deployed subset (excluding react-version/ and resources/images/) is
        # copied into _site first.
        run: |
          mkdir _site
          cp index.html aswin-sitting.png aswin-standing.png aswin-quote.png logo-icon.png logo-mark.png _site/
          cp "resources/Resume/Aswinroshan_Rajendran_Resume.pdf" "resources/Resume/Rajendran_Aswinroshan_CV.pdf" _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
